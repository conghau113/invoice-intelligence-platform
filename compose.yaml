# Dev infrastructure only (T0.6). Apps run on the host via `pnpm dev`.
# Production compose lives in T4.7. Every value below is a local dev default.
name: invoice-intelligence

# Host ports 5433/6380 (not 5432/6379) because the dev machine may already run native Postgres/Redis.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoice-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-invoice}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run only when pgdata is empty (first start).
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [invoice-net]

  # Redis 8 is used under AGPLv3, unmodified, as a separate container (docs/LEGAL.md).
  redis:
    image: redis:8
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [invoice-net]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: start-dev --import-realm
    volumes:
      # Realm-as-code (T1.1). Import runs only if the realm does not exist yet (IGNORE_EXISTING):
      # after editing realm-invoice.json run `docker compose down -v` (or drop the keycloak DB) to apply it.
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    environment:
      WEB_CLIENT_SECRET: ${WEB_CLIENT_SECRET:-web-secret-dev-only}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-only}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-invoice}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-invoice-dev-only}
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; probe the management port (9000) with bash /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [invoice-net]

networks:
  invoice-net:

volumes:
  pgdata:
  redisdata:
