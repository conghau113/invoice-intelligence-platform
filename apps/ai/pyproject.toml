[project]
name = "ai"
version = "0.1.0"
description = "Stateless AI service for the Invoice Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.34",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../eval"]  # ../../eval: the eval runner (T4.3)
# Browser tests need the `invoice-gen` group and Chromium: run them with `pnpm test:invoice-gen`.
addopts = "-m 'not browser'"
markers = ["browser: renders with a real Chromium (run by `pnpm test:invoice-gen`, not by CI)"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.102.0",
    # Exact pins: other versions can change the generated data (tools/invoice-gen).
    "faker==40.63.0",
    "jinja2==3.1.6",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
# Only for rendering synthetic invoices. Not a default group, so neither CI's Python job nor the
# image installs it. Keep the same version as @playwright/test in apps/web: same Chromium build.
invoice-gen = [
    "playwright==1.65.2",
]
