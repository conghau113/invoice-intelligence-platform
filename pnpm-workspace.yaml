packages:
  - 'apps/*'
  - 'packages/*'

# unrs-resolver's postinstall is only a fallback for platforms without a prebuilt binary; skip it.
allowBuilds:
  unrs-resolver: false
  # @parcel/watcher (via @nestjs/cli watch mode) ships prebuilt binaries; its install script is a fallback.
  '@parcel/watcher': false
  # esbuild (via drizzle-kit) ships its binary as a platform optional dependency; postinstall only verifies it.
  esbuild: false
  # @swc/core (via next-intl's optional message extractor) ships its binary as a platform optional dependency; its install script is only a fallback.
  '@swc/core': false
  # testcontainers' ssh2 and cpu-features only compile optional native speed-ups (pure-JS fallback exists); protobufjs's script only reads a version.
  cpu-features: false
  ssh2: false
  protobufjs: false
