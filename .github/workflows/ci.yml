name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless. Runs on main are never cancelled,
# so every commit that lands on main gets a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each check is its own step so a red run points at the exact gate that failed.
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Reads "packageManager" from package.json, same pnpm version as local dev.
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/ai is covered by the python job (its scripts need uv).
      - name: Lint
        run: pnpm turbo run lint --filter='!ai'
      - name: Typecheck
        run: pnpm turbo run typecheck --filter='!ai'
      - name: Test
        run: pnpm turbo run test --filter='!ai'
      - name: Build
        run: pnpm turbo run build --filter='!ai'

  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.0
          enable-cache: true
          cache-dependency-glob: apps/ai/uv.lock
      - run: uv sync --frozen --no-build
      - name: Lint
        run: uv run --frozen --no-build ruff check . ../../tools/invoice-gen ../../eval
      - name: Format
        run: uv run --frozen --no-build ruff format --check . ../../tools/invoice-gen ../../eval
      - name: Test
        run: uv run --frozen --no-build pytest

  # generated.py must match the Zod schemas; the check needs Node (build) and uv (codegen).
  schema-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.0
          enable-cache: true
          cache-dependency-glob: apps/ai/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --no-build
        working-directory: apps/ai
      - run: pnpm check:schema

  # Node-only gates with no dependencies: no pnpm install needed. check:schema stays in schema-drift (needs uv).
  repo-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: i18n parity
        run: pnpm check:i18n
      - name: ADR index
        run: pnpm check:adr
      - name: Docs links
        run: pnpm check:links
      - name: Eval dataset (hash of each file)
        run: pnpm check:eval-dataset
      - name: Gate tests (negative cases)
        run: pnpm test:scripts

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
      # Same command as "check:secrets" in package.json; bump the image tag in both places together.
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 git /repo --redact --no-banner --exit-code 1

  # Row-level security against a real Postgres. Testcontainers starts it from the Docker already on
  # the runner, applies the real migrations and seed, then jest runs as the non-owner app role.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The API imports `contracts` from its build output (dist), so build it first.
      - run: pnpm turbo run build --filter=contracts
      - run: pnpm test:int

  # Browser tests through the real stack: Keycloak, Postgres, API and web (production builds).
  # Every value below is a throw-away CI default, not a secret.
  e2e:
    runs-on: ubuntu-24.04
    env:
      E2E_START_SERVERS: '1'
      OIDC_ISSUER_URL: http://localhost:8080/realms/invoice
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-session-key-not-a-secret-0123456789
      KEYCLOAK_ISSUER: http://localhost:8080/realms/invoice
      KEYCLOAK_CLIENT_ID: web
      KEYCLOAK_CLIENT_SECRET: web-secret-dev-only
      API_BASE_URL: http://localhost:3001
      DATA_DIR: ${{ github.workspace }}/data
      # The API checks it at start and in /health/ready (compose publishes Redis on 6380, no password).
      REDIS_URL: redis://localhost:6380
      # The API and the worker require them at start; the AI service gets the same token below.
      AI_SERVICE_URL: http://localhost:8000
      AI_SERVICE_TOKEN: ci-only-token-not-a-secret-0123456789
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Random per run and masked: nothing password-shaped lives in this file.
      - name: Throw-away database passwords
        run: |
          for name in POSTGRES_PASSWORD APP_DB_PASSWORD; do
            value=$(openssl rand -hex 16)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start Postgres, Redis and Keycloak
        run: docker compose up -d --wait postgres redis keycloak
      - name: Migrate and seed
        run: |
          export DATABASE_OWNER_URL="postgres://invoice:${POSTGRES_PASSWORD}@localhost:5433/invoice"
          pnpm --filter api db:migrate && pnpm --filter api db:seed
      - name: Build api and web
        run: pnpm turbo run build --filter=api --filter=web
      # The servers in the Playwright step start under its pnpm shim, whose NODE_PATH once hid a
      # missing dependency (express, T3.6). Start the API the way an image will: plain node, no shim.
      - name: API starts with plain node
        timeout-minutes: 3 # also bounds the wait for a clean shutdown below
        working-directory: apps/api
        env:
          NODE_ENV: production
        run: |
          export DATABASE_URL="postgres://invoice_app:${APP_DB_PASSWORD}@localhost:5433/invoice"
          env -u NODE_PATH node dist/main.js > "$RUNNER_TEMP/api-start.log" 2>&1 &
          api=$!
          for _ in $(seq 1 30); do
            # Alive first: an answer from another process on this port would prove nothing.
            kill -0 "$api" 2>/dev/null || break
            if curl -fsS http://localhost:3001/health/ready; then
              kill "$api"
              wait "$api" || true
              exit 0
            fi
            sleep 1
          done
          echo "The API did not become ready"
          cat "$RUNNER_TEMP/api-start.log"
          kill "$api" 2>/dev/null || true
          exit 1
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      # The upload test follows a document through the queue: the worker takes the job and calls
      # the AI service (XML parser, and the LLM path with the fake provider: no network, no key).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.0
          enable-cache: true
          cache-dependency-glob: apps/ai/uv.lock
      - name: Install the AI service
        working-directory: apps/ai
        run: uv sync --frozen --no-build
      - name: Playwright
        run: |
          export DATABASE_URL="postgres://invoice_app:${APP_DB_PASSWORD}@localhost:5433/invoice"
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          (cd apps/ai && exec env LLM_PROVIDER=fake uv run --frozen --no-build uvicorn app.main:app --port 8000) > "$RUNNER_TEMP/ai.log" 2>&1 &
          (cd apps/api && exec node dist/worker.js) > "$RUNNER_TEMP/worker.log" 2>&1 &
          worker=$!
          for _ in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 1; done
          # The worker has no address to probe: a crash at start must fail here, not as a 45 s timeout.
          kill -0 "$worker" || { echo "worker exited at start"; cat "$RUNNER_TEMP/worker.log"; exit 1; }
          pnpm test:e2e
        env:
          NODE_ENV: production # install is done; the API refuses to start without it
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/ai.log
            ${{ runner.temp }}/worker.log
          retention-days: 7
      - name: Keycloak logs on failure
        if: failure()
        run: docker compose logs keycloak --tail 80
